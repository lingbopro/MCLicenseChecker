modLoader = "javafml"
loaderVersion = "[2,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "licensechecker"
version = "${version}"
displayName = "LicenseChecker"
authors = "lingbopro"
description = '''
Quickly check the licenses of installed mods.
'''
#logoFile = ""

[[dependencies.licensechecker]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.licensechecker]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.licensechecker]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "licensechecker.mixins.json"
